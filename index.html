<!doctype html>
<html lang="en" dir="ltr">

<style>
:root{--bg:#101113;--panel:#17181c;--panel2:#1e2025;--line:#2b2e35;--tx:#f1f1f3;--mut:#9b9ea8;--red:#d7263d;--red2:#ff5068;--ok:#4fbf8a;--warn:#d9a441;--info:#8c97ae;
--head:"Barlow Condensed","IBM Plex Sans Arabic","Arial Narrow",sans-serif;--body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14.5px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:.01em;margin:0;line-height:1.15}
h1{font-size:30px}h2{font-size:21px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.hide{display:none!important}
/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font:700 21px/1 var(--head);letter-spacing:.06em}
.brand span{font-size:11.5px;color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-inline-start:3px solid transparent;border-radius:0 6px 6px 0;padding:9px 12px;color:var(--mut);cursor:pointer;text-align:start;width:100%}
[dir=rtl] .nav button{border-radius:6px 0 0 6px}
.nav button:hover{background:var(--panel2);color:var(--tx)}

.nav svg{width:18px;height:18px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}

.top h2{font-size:22px}
.burger{display:none}
.page{padding:24px;max-width:1400px;width:100%}
.scrim{display:none}
@media(max-width:920px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);inset-inline-start:0;height:auto;width:262px;z-index:40;transform:translateX(-105%);transition:transform .2s}
 [dir=rtl] .side{transform:translateX(105%)}
 .app.navopen .side{transform:none}
 .app.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
 .burger{display:inline-flex}
 .top{padding:10px 14px}.page{padding:16px 14px}
}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel2);padding:7px 13px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:#464a55}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red2);border-color:var(--red2)}
.btn.ghost{background:transparent}.btn.danger{border-color:#6b2530;color:#ff8a98}.btn.danger:hover{background:#3a1a20}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon{background:none;border:0;padding:5px;border-radius:5px;cursor:pointer;color:var(--mut);display:inline-flex}.icon:hover{color:var(--tx);background:var(--panel2)}.icon svg{width:17px;height:17px}
input,select,textarea{background:#0f1012;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--red)}
.tb input,.tb select{width:auto}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.fld small{color:var(--mut);font-size:12px}.err{display:block;color:#ff8a98;font-size:12.5px;font-style:normal;min-height:0}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.multi{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#0f1012;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--tx)!important;margin:0!important;padding:3px 0;cursor:pointer}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:#255a45}.badge.warn{color:var(--warn);border-color:#6a5321}.badge.bad{color:#ff8a98;border-color:#6b2530}.badge.info{color:var(--info)}.badge.red{background:var(--red);border-color:var(--red);color:#fff}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12.5px;margin:2px}
.chip button{background:none;border:0;color:var(--mut);cursor:pointer;padding:0}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.panel>h3{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.g2,.g4{grid-template-columns:minmax(0,1fr)}}
.pghead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tb input[type=search]{min-width:220px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 13px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 13.5px var(--head);letter-spacing:.04em;color:var(--mut);background:var(--panel2);white-space:nowrap;position:relative}
th button{background:none;border:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;padding:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1b1d22}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.bar{height:6px;border-radius:9px;background:#2a2d34;min-width:64px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar.w i{background:var(--warn)}.bar.b i{background:var(--red)}
.empty{padding:38px 18px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--tx);font:600 18px var(--head);margin-bottom:4px}
.avatar{width:34px;height:34px;border-radius:50%;background:#2a2d34;display:inline-flex;align-items:center;justify-content:center;font:600 13px var(--head);flex:none;border:2px solid var(--uc,#2a2d34)}
.avatar.lg{width:72px;height:72px;font-size:24px}
.nm{display:flex;align-items:center;gap:10px}
.sk{background:linear-gradient(90deg,#1b1d22,#24272d,#1b1d22);background-size:200% 100%;animation:sk 1.1s infinite;border-radius:6px;height:18px;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}
/* readiness board (dashboard hero) */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.lane{background:var(--panel);padding:14px 16px;border-top:3px solid var(--uc);cursor:pointer;text-align:start;border-left:0;border-right:0;border-bottom:0}
.lane:hover{background:var(--panel2)}
.lane b{font:700 20px var(--head);letter-spacing:.05em;display:block}
.lane .n{font:700 34px/1 var(--head);margin:8px 0 2px}
@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font:700 34px/1 var(--head)}.stat span{color:var(--mut);font-size:13px}
.list{list-style:none;margin:0;padding:0}.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.list li:last-child{border:0}
.dt{font:600 12px var(--head);text-align:center;min-width:46px;padding:4px 0;border:1px solid var(--line);border-radius:5px;line-height:1.15}.dt b{display:block;font-size:19px}
/* charts */
.chart{width:100%;height:auto;direction:ltr}.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--mut);font-size:11px}.chart .ln{fill:none;stroke:var(--red2);stroke-width:2.5}.chart .ar{fill:rgba(215,38,61,.14)}.chart .dot{fill:var(--bg);stroke:var(--red2);stroke-width:2}.chart .bx{fill:var(--red)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
/* tree */
.treewrap{overflow:auto;padding:10px 4px 20px}
.tree{direction:ltr;min-width:max-content;margin:auto}
.tree ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;position:relative}
.tree li{list-style:none;text-align:center;position:relative;padding:20px 8px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;border-top:1px solid #4a4e59;width:50%;height:20px}
.tree li::after{right:auto;left:50%;border-left:1px solid #4a4e59}
.tree li:only-child::after,.tree li:only-child::before{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1px solid #4a4e59;border-radius:0 5px 0 0}
.tree li:first-child::after{border-radius:5px 0 0 0}
.tree>ul>li::before,.tree>ul>li::after{display:none}.tree>ul{padding-top:0}.tree>ul>li{padding-top:0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:1px solid #4a4e59;height:20px}
.node{position:relative;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--uc);border-radius:6px;padding:8px 12px;min-width:150px;max-width:190px;text-align:start;cursor:pointer;display:block}
[dir=rtl] .node{direction:rtl}
.node:hover{border-color:#555a67}.node b{display:block;font-size:13.5px;line-height:1.3}.node small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.node .ed{position:absolute;top:3px;inset-inline-end:3px}
.stack{display:flex;flex-direction:column;gap:6px;margin-top:14px;position:relative;align-items:stretch;padding-inline-start:0}
.stack::before{content:'';position:absolute;top:-14px;left:50%;height:14px;border-left:1px solid #4a4e59}
.node.mini{min-width:150px;padding:6px 10px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);gap:1px}
.cal .h{background:var(--panel2);padding:7px;text-align:center;font:600 13px var(--head);color:var(--mut)}
.cal .d{background:var(--panel);min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px}
.cal .d.x{background:#131417}.cal .d.t{box-shadow:inset 0 0 0 1px var(--red)}
.cal .d>div{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.cal .add{opacity:0;background:none;border:0;color:var(--mut);cursor:pointer;padding:0 3px}.cal .d:hover .add,.cal .add:focus-visible{opacity:1}
.pill{display:block;width:100%;text-align:start;border:0;border-inline-start:3px solid var(--pc);background:var(--panel2);padding:2px 6px;border-radius:3px;font-size:12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill:hover{background:#2a2d34}.pill.can{opacity:.5;text-decoration:line-through}
@media(max-width:700px){.cal .d{min-height:70px}.pill{font-size:10.5px;padding:1px 3px}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--mut);cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--tx);border-bottom-color:var(--red)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.mbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(480px,100%);max-height:calc(100dvh - 40px);overflow:auto}
.mbox.wide{width:min(680px,100%)}.mbox h3{margin-bottom:14px;font-size:22px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toasts{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line);border-inline-start:4px solid var(--ok);padding:10px 14px;border-radius:6px;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.err{border-inline-start-color:var(--red)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.lhero{padding:36px;background:linear-gradient(160deg,#1d1114 0%,#17181c 70%);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:14px;justify-content:center}
.lhero svg{width:74px;height:74px}.lhero h1{font-size:40px;letter-spacing:.04em}
.lform{padding:36px}
.demo{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.demo button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:6px 0;cursor:pointer;color:var(--mut);text-align:start}.demo button:hover{color:var(--tx)}
@media(max-width:760px){.lbox{grid-template-columns:1fr}.lhero{border:0;border-bottom:1px solid var(--line);padding:24px}.lform{padding:24px}}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0}
.note{border-inline-start:3px solid var(--warn);background:#221d12;padding:9px 12px;border-radius:4px;font-size:13px}
.ann{border-inline-start:4px solid var(--line)}.ann.Critical{border-inline-start-color:var(--red)}.ann.High{border-inline-start-color:var(--warn)}
.ann p{white-space:pre-wrap;margin:8px 0 0}
</style>

 expE:()=>exportCsv('events',[['Date','Time','Title','Type','Organizer','Participants','Attended','Status'],...[...S.events].sort(byDate).map(e=>[e.date,e.time,e.title,e.type,mname(e.organizer),e.participants.length,(e.attended||[]).length,e.status])]),
 rtab:d=>{ui.rtab=d.k;render()},
 expR:d=>{const r=reportData();const map={attendance:[['Member ID','Name','Unit','Invited','Attended','Rate'],r.att],'training-completion':[['Unit','Sessions held','Invited','Attended','Completion'],r.tr],'member-activity':[['Member ID','Name','Status','Sessions attended','Last activity'],r.activity],promotions:[['Date','Member ID','Name','From','To','Approved by'],r.promos],'admin-actions':[['Timestamp','User','Action','Detail'],r.adm]};exportCsv(d.nm,[map[d.nm][0],...map[d.nm][1]])},
 addA:()=>openForm({title:_('Publish announcement','نشر إعلان'),fields:annFields(),values:{priority:'Normal',pinned:'no'},wide:1,submit:_('Publish','نشر'),onSave:v=>{S.anns.push({id:uid('A'),title:v.title,body:v.body,priority:v.priority,pinned:v.pinned==='yes',author:ui.user.memberId||ui.user.username,date:today(),archived:false});log('Announcement',`Published "${v.title}"`);commit();toast(_('Published.','تم النشر.'))}}),
 editA:d=>{const a=S.anns.find(x=>x.id===d.id);openForm({title:_('Edit announcement','تعديل الإعلان'),fields:annFields(),values:{...a,pinned:a.pinned?'yes':'no'},wide:1,onSave:v=>{Object.assign(a,{title:v.title,body:v.body,priority:v.priority,pinned:v.pinned==='yes'});log('Announcement',`Edited "${a.title}"`);commit();toast(_('Saved.','تم الحفظ.'))}})},
 pinA:d=>{const a=S.anns.find(x=>x.id===d.id);a.pinned=!a.pinned;log('Announcement',`${a.pinned?'Pinned':'Unpinned'} "${a.title}"`);commit()},
 arcA:d=>{const a=S.anns.find(x=>x.id===d.id);a.archived=!a.archived;if(a.archived)a.pinned=false;log('Announcement',`${a.archived?'Archived':'Restored'} "${a.title}"`);commit();toast(a.archived?_('Archived.','تمت الأرشفة.'):_('Restored.','تمت الاستعادة.'))},
 delA:d=>{const a=S.anns.find(x=>x.id===d.id);ask(_(`Delete "${a.title}" permanently?`,`حذف "${a.title}" نهائياً؟`),()=>{S.anns=S.anns.filter(x=>x.id!==a.id);log('Announcement',`Deleted "${a.title}"`);commit()},{label:_('Delete','حذف')})},
 pwUser:d=>openForm({title:_('Change password','تغيير كلمة المرور'),fields:[{k:'password',l:_('New password','كلمة المرور الجديدة'),t:'password',req:1,max:64,h:_('At least 8 characters with a letter and a number.','8 أحرف على الأقل مع حرف ورقم.')}],validate:v=>{const e={};if(v.password&&!(v.password.length>=8&&/[A-Za-z]/.test(v.password)&&/\d/.test(v.password)))e.password=_('Too weak.','كلمة المرور ضعيفة.');return e},onSave:async v=>{const u=S.users.find(x=>x.username===d.u);u.hash=await sha(v.password);log('Password change',`Changed password for ${u.username}`);commit();toast(_('Password updated.','تم تحديث كلمة المرور.'))}}),
 addUser:()=>openForm({title:_('Add user','إضافة مستخدم'),fields:[{k:'username',l:_('Username','اسم المستخدم'),req:1,max:20,h:_('Lowercase letters, numbers and underscores.','حروف صغيرة وأرقام وشرطة سفلية.')},{k:'password',l:_('Password','كلمة المرور'),t:'password',req:1,max:64,h:_('At least 8 characters with a letter and a number.','8 أحرف على الأقل مع حرف ورقم.')},{k:'role',l:_('Role','الدور'),t:'select',o:Object.keys(ROLES).map(k=>[k,lab(ROLES,k)])},{k:'memberId',l:_('Linked member','العضو المرتبط'),t:'select',o:[['',_('— None —','— لا أحد —')],...memberOpts()]}],values:{role:'member'},
  validate:v=>{const e={};if(v.username&&!/^[a-z0-9_]{3,20}$/.test(v.username))e.username=_('Use 3–20 lowercase letters, numbers or underscores.','استخدم 3–20 حرفاً صغيراً أو رقماً أو شرطة سفلية.');else if(S.users.some(u=>u.username===v.username))e.username=_('This username exists.','اسم المستخدم موجود.');if(v.password&&!(v.password.length>=8&&/[A-Za-z]/.test(v.password)&&/\d/.test(v.password)))e.password=_('Too weak.','كلمة المرور ضعيفة.');return e},
  onSave:async v=>{S.users.push({username:v.username,hash:await sha(v.password),role:v.role,memberId:v.memberId||null});log('User added',`Added user ${v.username} (${v.role})`);commit();toast(_('User added.','تمت إضافة المستخدم.'))}}),
 delUser:d=>ask(_(`Delete user ${d.u}?`,`حذف المستخدم ${d.u}؟`),()=>{S.users=S.users.filter(u=>u.username!==d.u);log('User deleted',`Deleted user ${d.u}`);commit()},{label:_('Delete','حذف')}),
 resetAll:()=>ask(_('Erase ALL department data (members, events, announcements, log) for everyone? This cannot be undone.','مسح كل بيانات القسم (الأعضاء والأحداث والإعلانات والسجل) للجميع؟ لا يمكن التراجع.'),()=>{S=seed();log('System','Data erased');commit();toast(_('Data erased.','تم مسح البيانات.'))},{label:_('Erase','مسح')})
};
const IN={
 mq:v=>{ui.mf.q=v;ui.mf.page=1;$('#mtbl').innerHTML=membersTable()},mu:v=>{ui.mf.unit=v;ui.mf.page=1;$('#mtbl').innerHTML=membersTable()},mr:v=>{ui.mf.rank=v;ui.mf.page=1;$('#mtbl').innerHTML=membersTable()},ms:v=>{ui.mf.status=v;ui.mf.page=1;$('#mtbl').innerHTML=membersTable()},
 ma:(v,el)=>{ui.mf.arch=el.checked;ui.mf.page=1;render()},et:v=>{ui.ef.type=v;render()},es:v=>{ui.ef.status=v;render()},annArch:(v,el)=>{ui.showArch=el.checked;render()},
 auf:v=>{ui.auf=v;const q=v.toLowerCase();$('#audtbl').innerHTML=auditTable(S.audit.filter(a=>!q||(a.user+a.action+a.detail).toLowerCase().includes(q)))},
 assignU:(v,el)=>{if(!v)return;const m=M(v),u=U(el.dataset.uid);ask(_(`Move ${m.name} to ${u.name}?`,`نقل ${m.name} إلى ${un(u)}؟`),()=>{m.unit=u.id;log('Unit assignment',`Assigned ${m.id} to ${u.name}`);commit();toast(_('Member assigned.','تم تعيين العضو.'))},{label:_('Assign','تعيين'),danger:false});el.value=''},
 urole:(v,el)=>{const u=(ui.profiles||[]).find(x=>x.id===el.dataset.u);if(!u||u.role===v)return;el.value=u.role;
  if(u.role==='admin'&&ui.profiles.filter(x=>x.role==='admin').length<2){toast(_('At least one Administrator is required.','يلزم وجود مدير نظام واحد على الأقل.'),'err');return}
  ask(_(`Change ${u.username} to ${lab(ROLES,v)}?`,`تغيير ${u.username} إلى ${lab(ROLES,v)}؟`),async()=>{const{error}=await sb.from('profiles').update({role:v}).eq('id',u.id);if(error){toast(_('Could not change the role.','تعذّر تغيير الدور.'),'err');return}log('Role change',`${u.username}: ${u.role} → ${v}`);u.role=v;if(ui.user.id===u.id)ui.user.role=v;commit();toast(_('Role updated.','تم تحديث الدور.'))},{label:_('Change role','تغيير الدور'),danger:false})},
 umember:async(v,el)=>{const u=(ui.profiles||[]).find(x=>x.id===el.dataset.u);if(!u)return;const{error}=await sb.from('profiles').update({member_id:v||null}).eq('id',u.id);if(error){toast(_('Could not save.','تعذّر الحفظ.'),'err');el.value=u.member_id||'';return}u.member_id=v||null;if(ui.user.id===u.id)ui.user.memberId=v||null;log('Account link',`${u.username} linked to ${v||'none'}`);commit();toast(_('Saved.','تم الحفظ.'))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const h=ACT[el.dataset.act];if(h){if(el.tagName!=='INPUT')e.preventDefault();h(el.dataset,el)}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&IN[el.dataset.in])IN[el.dataset.in](el.value,el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('node')){e.preventDefault();e.target.click()}});
/* ---------- boot ---------- */
async function boot(){
 const l=lsGet(LNG);ui.lang=l||((navigator.language||'').startsWith('ar')?'ar':'en');render();
 if(!window.supabase||!SB_URL||SB_URL.includes('YOUR-')){ui.boot=false;ui.setup=true;render();return}
 sb=window.supabase.createClient(SB_URL,SB_KEY);
 try{const{data}=await sb.auth.getSession();if(data&&data.session)await startSession(data.session.user)}catch(e){console.error(e);ui.user=null}
 ui.boot=false;render();setInterval(poll,8000);
 document.addEventListener('focusout',()=>setTimeout(()=>{if(rq&&$('#modal').hidden&&!/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))flushRemote()},60))}
boot();
})();
</script>
